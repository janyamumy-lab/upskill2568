<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join the Club! 🌟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Page background: animated rainbow gradient ───────── */
    body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #FF6B9D, #FFD93D, #6BCB77, #4D96FF, #C77DFF);
      background-size: 400% 400%;
      animation: bgShift 10s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
      overflow-x: hidden;
    }

    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── Floating stars decoration ────────────────────────── */
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .star {
      position: absolute;
      font-size: 1.4rem;
      animation: floatStar linear infinite;
      opacity: 0.6;
    }
    @keyframes floatStar {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-120px) rotate(720deg); opacity: 0; }
    }

    /* ── Header ───────────────────────────────────────────── */
    .page-header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 28px;
    }
    .page-header h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.4rem, 7vw, 4rem);
      color: #fff;
      text-shadow: 4px 4px 0 #FF6B9D, 7px 7px 0 rgba(0,0,0,.15);
      letter-spacing: 2px;
      line-height: 1.1;
      animation: bounce 2s ease infinite;
    }
    .page-header .subtitle {
      margin-top: 8px;
      font-size: 1.15rem;
      color: #fff;
      font-weight: 700;
      text-shadow: 1px 1px 4px rgba(0,0,0,.25);
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }

    /* ── Card ─────────────────────────────────────────────── */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.96);
      border-radius: 32px;
      padding: 40px 36px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18), 0 0 0 6px rgba(255,255,255,0.5);
    }

    /* ── Section titles inside card ───────────────────────── */
    .section-label {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      color: #fff;
      background: linear-gradient(90deg, #FF6B9D, #C77DFF);
      border-radius: 50px;
      padding: 4px 18px;
      display: inline-block;
      margin-bottom: 16px;
      margin-top: 24px;
    }
    .section-label:first-of-type { margin-top: 0; }

    /* ── Form fields ──────────────────────────────────────── */
    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 800;
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 6px;
    }
    label .emoji { margin-right: 6px; }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    select {
      width: 100%;
      padding: 12px 16px;
      border: 3px solid #e0e0e0;
      border-radius: 16px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      background: #fafafa;
      outline: none;
      transition: border-color .25s, box-shadow .25s, background .25s;
    }
    input:focus, select:focus {
      border-color: #C77DFF;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(199,125,255,0.2);
    }

    /* ── Password toggle ──────────────────────────────────── */
    .pw-wrap {
      position: relative;
    }
    .pw-wrap input { padding-right: 48px; }
    .pw-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
    }

    /* ── Avatar picker ─────────────────────────────────────── */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }
    .avatar-grid input[type="radio"] { display: none; }
    .avatar-grid label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      border: 3px solid #e0e0e0;
      border-radius: 16px;
      padding: 8px 4px;
      cursor: pointer;
      transition: border-color .2s, transform .2s, background .2s;
      background: #fafafa;
      margin: 0;
    }
    .avatar-grid input[type="radio"]:checked + label {
      border-color: #FF6B9D;
      background: #fff0f6;
      transform: scale(1.15);
      box-shadow: 0 4px 12px rgba(255,107,157,.3);
    }

    /* ── Color picker ──────────────────────────────────────── */
    .color-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .color-row input[type="radio"] { display: none; }
    .color-swatch-label {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      border: 4px solid transparent;
      transition: transform .2s, border-color .2s;
      display: block;
      margin: 0;
    }
    .color-row input[type="radio"]:checked + .color-swatch-label {
      border-color: #333;
      transform: scale(1.25);
    }

    /* ── Custom color input ────────────────────────────────── */
    input[type="color"] {
      -webkit-appearance: none;
      border: 3px solid #e0e0e0;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      padding: 2px;
      cursor: pointer;
      background: #fafafa;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { border-radius: 50%; padding: 0; }
    input[type="color"]::-webkit-color-swatch { border-radius: 50%; border: none; }

    /* ── Submit button ────────────────────────────────────── */
    .btn-submit {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #FF6B9D, #FFD93D, #6BCB77, #4D96FF, #C77DFF);
      background-size: 200%;
      animation: btnShift 4s linear infinite;
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: #fff;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: transform .2s, box-shadow .2s;
    }
    .btn-submit:hover  { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.25); }
    .btn-submit:active { transform: translateY(1px); }
    @keyframes btnShift {
      0%   { background-position: 0%; }
      100% { background-position: 200%; }
    }

    /* ── Toast messages ───────────────────────────────────── */
    #toast {
      display: none;
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 16px 28px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 800;
      text-align: center;
      max-width: 90vw;
      box-shadow: 0 8px 30px rgba(0,0,0,.2);
      animation: slideDown .4s ease;
    }
    #toast.success { background: #6BCB77; color: #fff; }
    #toast.error   { background: #FF6B6B; color: #fff; }
    @keyframes slideDown {
      from { top: -80px; opacity: 0; }
      to   { top: 24px;  opacity: 1; }
    }

    /* ── Success screen ───────────────────────────────────── */
    #success-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: linear-gradient(135deg,#FF6B9D,#FFD93D,#6BCB77,#4D96FF,#C77DFF);
      background-size: 400% 400%;
      animation: bgShift 6s ease infinite;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    #success-screen .big-avatar {
      font-size: 6rem;
      animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both;
    }
    #success-screen h2 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2rem, 8vw, 3.5rem);
      color: #fff;
      text-shadow: 3px 3px 0 rgba(0,0,0,.15);
      margin: 16px 0 8px;
      animation: popIn .6s .1s cubic-bezier(.34,1.56,.64,1) both;
    }
    #success-screen p {
      font-size: 1.2rem;
      color: #fff;
      font-weight: 700;
      text-shadow: 1px 1px 4px rgba(0,0,0,.2);
      animation: popIn .6s .2s cubic-bezier(.34,1.56,.64,1) both;
    }
    #success-screen .confetti-row {
      font-size: 2.5rem;
      margin-top: 20px;
      animation: popIn .6s .3s cubic-bezier(.34,1.56,.64,1) both;
    }
    #success-screen .btn-back {
      margin-top: 32px;
      padding: 14px 36px;
      border: none;
      border-radius: 50px;
      background: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      color: #FF6B9D;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
      animation: popIn .6s .4s cubic-bezier(.34,1.56,.64,1) both;
      transition: transform .2s;
    }
    #success-screen .btn-back:hover { transform: scale(1.07); }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.4); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ── Field error state ────────────────────────────────── */
    .field-error {
      font-size: 0.82rem;
      color: #FF6B6B;
      font-weight: 700;
      margin-top: 5px;
      display: none;
    }
    .has-error input,
    .has-error select { border-color: #FF6B6B !important; }
    .has-error .field-error { display: block; }

    /* ── Spinner on button ─────────────────────────────────── */
    .btn-submit.loading { pointer-events: none; opacity: .8; }
    .spinner {
      display: none;
      width: 22px; height: 22px;
      border: 3px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .spinner  { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Members link ─────────────────────────────────────── */
    .members-link {
      position: relative;
      z-index: 1;
      margin-top: 20px;
      text-align: center;
    }
    .members-link a {
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      text-decoration: none;
      text-shadow: 1px 1px 4px rgba(0,0,0,.2);
      border-bottom: 2px dashed rgba(255,255,255,.6);
      padding-bottom: 2px;
      transition: opacity .2s;
    }
    .members-link a:hover { opacity: .8; }

    @media (max-width: 420px) {
      .card { padding: 28px 20px; }
      .avatar-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

<!-- Floating stars -->
<div class="stars" id="stars"></div>

<!-- Toast -->
<div id="toast"></div>

<!-- Success screen (shown after register) -->
<div id="success-screen">
  <div class="big-avatar" id="ss-avatar">🌟</div>
  <h2 id="ss-name">Welcome, Friend!</h2>
  <p id="ss-msg">You're now a member of our awesome club!</p>
  <div class="confetti-row">🎉 🎊 🥳 🎈 🎁</div>
  <button class="btn-back" onclick="resetForm()">Register Another ➕</button>
  <button class="btn-back" style="margin-left:12px;color:#4D96FF" onclick="window.location.href='members.php'">View Members 👀</button>
</div>

<!-- Page header -->
<header class="page-header">
  <h1>🌟 Join the Club! 🌟</h1>
  <p class="subtitle">Fill in the form below to become a member 🎉</p>
</header>

<!-- Registration card -->
<div class="card">
  <form id="reg-form" novalidate>

    <!-- ── Account Info ───────────────────────────────────── -->
    <span class="section-label">🔑 Account Info</span>

    <div class="field" id="f-username">
      <label><span class="emoji">😎</span>Username</label>
      <input type="text" id="username" placeholder="coolkid123" maxlength="30" autocomplete="username" />
      <div class="field-error" id="e-username"></div>
    </div>

    <div class="field" id="f-password">
      <label><span class="emoji">🔒</span>Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" />
        <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show/hide password">👁️</button>
      </div>
      <div class="field-error" id="e-password"></div>
    </div>

    <!-- ── Personal Info ──────────────────────────────────── -->
    <span class="section-label">🧒 Personal Info</span>

    <div class="field" id="f-full_name">
      <label><span class="emoji">📛</span>Full Name</label>
      <input type="text" id="full_name" placeholder="Your real name" maxlength="120" autocomplete="name" />
      <div class="field-error" id="e-full_name"></div>
    </div>

    <div class="field" id="f-email">
      <label><span class="emoji">📧</span>Email (parent/guardian OK!)</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      <div class="field-error" id="e-email"></div>
    </div>

    <div class="field" id="f-birthday">
      <label><span class="emoji">🎂</span>Birthday</label>
      <input type="date" id="birthday" max="" />
      <div class="field-error" id="e-birthday"></div>
    </div>

    <div class="field" id="f-gender">
      <label><span class="emoji">🌈</span>I am a…</label>
      <select id="gender">
        <option value="">-- Pick one --</option>
        <option value="boy">🚀 Boy</option>
        <option value="girl">🌸 Girl</option>
        <option value="other">🦄 Prefer not to say</option>
      </select>
      <div class="field-error" id="e-gender"></div>
    </div>

    <!-- ── Choose Your Avatar ────────────────────────────── -->
    <span class="section-label">🎭 Pick Your Avatar</span>
    <div class="field" id="f-avatar">
      <div class="avatar-grid" id="avatar-grid">
        <!-- filled by JS -->
      </div>
      <div class="field-error" id="e-avatar"></div>
    </div>

    <!-- ── Favourite Colour ───────────────────────────────── -->
    <span class="section-label">🎨 Favourite Colour</span>
    <div class="field" id="f-fav_color">
      <div class="color-row" id="color-row">
        <!-- filled by JS -->
      </div>
      <div class="field-error" id="e-fav_color"></div>
    </div>

    <!-- ── Submit ─────────────────────────────────────────── -->
    <button type="submit" class="btn-submit">
      <span class="btn-text">🚀 Join Now!</span>
      <div class="spinner"></div>
    </button>
  </form>
</div>

<div class="members-link">
  <a href="members.php">👀 View all members</a>
</div>

<script>
// ── Floating stars ──────────────────────────────────────────────────────────
const EMOJIS = ['⭐','🌟','✨','💫','🌈','🎈','🎀','🍭','🌸','🦋'];
const starsEl = document.getElementById('stars');
for (let i = 0; i < 18; i++) {
  const s = document.createElement('span');
  s.className = 'star';
  s.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
  s.style.left   = Math.random() * 100 + 'vw';
  s.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
  const dur = 8 + Math.random() * 12;
  s.style.animationDuration = dur + 's';
  s.style.animationDelay    = -(Math.random() * dur) + 's';
  starsEl.appendChild(s);
}

// ── Avatar grid ─────────────────────────────────────────────────────────────
const AVATARS = ['🌟','🦄','🐶','🐱','🐸','🦊','🐼','🐨','🦁','🐯','🦋','🌈'];
const avatarGrid = document.getElementById('avatar-grid');
AVATARS.forEach((av, i) => {
  const id = 'av_' + i;
  const input = document.createElement('input');
  input.type = 'radio'; input.name = 'avatar'; input.value = av; input.id = id;
  if (i === 0) input.checked = true;
  const lbl = document.createElement('label');
  lbl.htmlFor = id; lbl.textContent = av;
  avatarGrid.appendChild(input);
  avatarGrid.appendChild(lbl);
});

// ── Colour swatches ─────────────────────────────────────────────────────────
const COLORS = ['#FF6B6B','#FF6B9D','#FFD93D','#6BCB77','#4D96FF','#C77DFF','#FF9A3C','#00C9C8'];
const colorRow = document.getElementById('color-row');
COLORS.forEach((c, i) => {
  const id = 'col_' + i;
  const input = document.createElement('input');
  input.type = 'radio'; input.name = 'fav_color'; input.value = c; input.id = id;
  if (i === 0) input.checked = true;
  const lbl = document.createElement('label');
  lbl.className = 'color-swatch-label';
  lbl.htmlFor = id;
  lbl.style.background = c;
  lbl.title = c;
  colorRow.appendChild(input);
  colorRow.appendChild(lbl);
});
// Custom colour
const customColorLbl = document.createElement('label');
customColorLbl.textContent = '🎨';
customColorLbl.style.cssText = 'font-size:1.4rem;cursor:pointer;line-height:40px;margin:0;';
const customColorIn = document.createElement('input');
customColorIn.type = 'color'; customColorIn.id = 'custom_color'; customColorIn.title = 'Pick any color';
customColorIn.style.marginLeft = '4px';
customColorIn.addEventListener('input', () => {
  document.querySelectorAll('[name="fav_color"]').forEach(r => r.checked = false);
});
colorRow.appendChild(customColorLbl);
colorRow.appendChild(customColorIn);

// ── Birthday max = today ────────────────────────────────────────────────────
document.getElementById('birthday').max = new Date().toISOString().split('T')[0];

// ── Password toggle ─────────────────────────────────────────────────────────
document.getElementById('pw-toggle').addEventListener('click', () => {
  const pw = document.getElementById('password');
  const btn = document.getElementById('pw-toggle');
  if (pw.type === 'password') { pw.type = 'text'; btn.textContent = '🙈'; }
  else                        { pw.type = 'password'; btn.textContent = '👁️'; }
});

// ── Helpers ─────────────────────────────────────────────────────────────────
function showToast(msg, type = 'error') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 4500);
}

function setFieldError(fieldId, msg) {
  const f = document.getElementById('f-' + fieldId);
  const e = document.getElementById('e-' + fieldId);
  if (!f || !e) return;
  f.classList.add('has-error');
  e.textContent = msg;
}

function clearErrors() {
  document.querySelectorAll('.has-error').forEach(f => f.classList.remove('has-error'));
  document.querySelectorAll('.field-error').forEach(e => e.textContent = '');
}

function getSelectedAvatar() {
  const checked = document.querySelector('[name="avatar"]:checked');
  return checked ? checked.value : null;
}

function getSelectedColor() {
  const checked = document.querySelector('[name="fav_color"]:checked');
  if (checked) return checked.value;
  const custom = document.getElementById('custom_color').value;
  return custom || null;
}

// ── Form submit ─────────────────────────────────────────────────────────────
document.getElementById('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErrors();

  const username  = document.getElementById('username').value.trim();
  const password  = document.getElementById('password').value;
  const full_name = document.getElementById('full_name').value.trim();
  const email     = document.getElementById('email').value.trim();
  const birthday  = document.getElementById('birthday').value;
  const gender    = document.getElementById('gender').value;
  const avatar    = getSelectedAvatar();
  const fav_color = getSelectedColor();

  // Client-side quick checks
  let hasErr = false;
  if (!username) { setFieldError('username', 'Please choose a username'); hasErr = true; }
  if (!password || password.length < 6) { setFieldError('password', 'Password must be at least 6 characters'); hasErr = true; }
  if (!full_name) { setFieldError('full_name', 'Please enter your full name'); hasErr = true; }
  if (!email) { setFieldError('email', 'Please enter your email'); hasErr = true; }
  if (!birthday) { setFieldError('birthday', 'Please enter your birthday'); hasErr = true; }
  if (!gender) { setFieldError('gender', 'Please pick one'); hasErr = true; }
  if (!avatar) { setFieldError('avatar', 'Please pick an avatar'); hasErr = true; }
  if (!fav_color) { setFieldError('fav_color', 'Please pick a colour'); hasErr = true; }
  if (hasErr) return;

  const btn = document.querySelector('.btn-submit');
  btn.classList.add('loading');

  try {
    const res = await fetch('member_api.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, full_name, email, birthday, gender, avatar, fav_color })
    });
    const data = await res.json();

    if (data.ok) {
      showSuccessScreen(data.avatar, data.username);
    } else {
      (data.errors || [data.error]).forEach(err => {
        if (/username/i.test(err))   setFieldError('username', err);
        else if (/email/i.test(err)) setFieldError('email', err);
        else if (/password/i.test(err)) setFieldError('password', err);
        else if (/birthday/i.test(err)) setFieldError('birthday', err);
        else if (/gender/i.test(err)) setFieldError('gender', err);
        else if (/avatar/i.test(err)) setFieldError('avatar', err);
        else if (/color/i.test(err)) setFieldError('fav_color', err);
        else showToast('⚠️ ' + err, 'error');
      });
    }
  } catch (err) {
    showToast('❌ Could not connect to server. Is XAMPP running?', 'error');
  } finally {
    btn.classList.remove('loading');
  }
});

// ── Success screen ──────────────────────────────────────────────────────────
function showSuccessScreen(avatar, username) {
  document.getElementById('ss-avatar').textContent = avatar;
  document.getElementById('ss-name').textContent   = 'Welcome, ' + username + '! 🎉';
  document.getElementById('ss-msg').textContent     = "You're now a member of our awesome club!";
  const ss = document.getElementById('success-screen');
  ss.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function resetForm() {
  document.getElementById('success-screen').style.display = 'none';
  document.body.style.overflow = '';
  document.getElementById('reg-form').reset();
  document.getElementById('av_0').checked = true;
  document.getElementById('col_0').checked = true;
  clearErrors();
}
</script>
</body>
</html>
